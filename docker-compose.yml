services:
  postgres:
    image: postgres:17-alpine
    container_name: devsecops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devsecops

  api:
    image: devsecops-api:latest
    build:
      context: ./api
    container_name: devsecops-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://portfolio:portfolio_dev_only@postgres:5432/portfolio?schema=public}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - devsecops
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: devsecops-portfolio:latest
    build:
      context: ./frontend
    container_name: devsecops-portfolio
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://api:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - devsecops

networks:
  devsecops:
    driver: bridge

volumes:
  postgres_data:
