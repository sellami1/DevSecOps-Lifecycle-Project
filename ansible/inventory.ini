# Keep group names and host aliases consistent with the playbooks that reference them.
# Do not rename them unless you also update those playbooks.
# Change host connection details only when the server, SSH user, or key changes.
# Group of Ubuntu servers targeted by the playbooks.
[ubuntu_servers]
# jenkins-ci is Ansible's inventory alias for this machine.
# ansible_host is the machine's reachable IP address or DNS name.
# ansible_user is the SSH account Ansible uses to connect.
# ansible_ssh_private_key_file is the private key used for SSH authentication.
jenkins-ci ansible_host=192.168.122.149 ansible_user=devops ansible_ssh_private_key_file=~/.ssh/id_ed25519_deb131

# Inventory group name; playbooks can target this group with `hosts: docker_targets`.
# `garderie-target` is the alias for one host in that group, not the group name.
# Its connection details below tell Ansible how to reach that host.
[docker_targets]
garderie-target ansible_host=192.168.122.62 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_ed25519_deb132