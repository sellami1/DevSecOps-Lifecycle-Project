---
- name: Install Docker Engine on target VMs
  hosts: docker_targets
  become: true
  vars:
    docker_apt_distribution: "{{ ansible_distribution | lower }}"
    docker_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
  pre_tasks:
    - name: Verify the target is a supported Debian-family distribution and architecture
      ansible.builtin.assert:
        that:
          - docker_apt_distribution in ['debian', 'ubuntu']
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: >-
          Docker installation supports Debian or Ubuntu on x86_64 or aarch64;
          found {{ ansible_distribution }} on {{ ansible_architecture }}.
  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ docker_apt_distribution }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the Ansible SSH user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Verify docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"