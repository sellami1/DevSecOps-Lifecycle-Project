---
- name: Install common packages on Debian-family servers
  hosts: apt_servers
  become: true
  vars:
    packages:
      - curl
      - git
      - jq
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
